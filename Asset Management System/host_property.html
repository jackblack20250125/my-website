<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主機財產管理系統</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            /* Light theme - Apple-like aesthetics */
            --bg-base: #f5f5f7;
            --bg-panel: #ffffff;
            --bg-card: #ffffff;
            --accent-glow: #0071e3; /* Apple Blue */
            --accent-dim: rgba(0, 113, 227, 0.15);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --danger: #ff3b30;
            --success: #34c759;
            --border: #d2d2d7;
            --border-glow: #0071e3;
            
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.1);
            
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            /* Subtle background flair */
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 113, 227, 0.03), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(52, 199, 89, 0.03), transparent 25%);
            background-attachment: fixed;
        }

        /* Navbar / Header */
        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(210, 210, 215, 0.5);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0 rgba(0,0,0,0.02);
        }

        .logo {
            font-family: 'Orbitron', -apple-system, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--accent-glow);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Layout */
        main {
            padding: 3rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Controls Area */
        .controls-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        /* Search Box */
        .search-container {
            position: relative;
            flex: 1;
            max-width: 600px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 1.2rem 1.5rem 1.2rem 3.5rem;
            border-radius: var(--radius-lg);
            font-size: 1.05rem;
            font-family: inherit;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 4px var(--accent-dim), var(--shadow-md);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            fill: var(--text-muted);
            transition: var(--transition);
        }

        .search-input:focus + .search-icon,
        .search-input:not(:placeholder-shown) + .search-icon {
            fill: var(--accent-glow);
        }

        /* Buttons */
        .btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: #f8f8f9;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent-glow);
            border-color: var(--accent-glow);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-primary:hover {
            background: #0077ed;
            color: white;
            box-shadow: 0 8px 16px rgba(0, 113, 227, 0.4);
        }

        /* Status & Empty state */
        .status-message {
            margin-top: 1rem;
            font-size: 0.95rem;
            color: var(--text-muted);
            min-height: 24px;
            padding-left: 0.5rem;
        }

        .not-found-area {
            display: none;
            animation: fadeIn 0.4s ease forwards;
            background: rgba(255, 59, 48, 0.08);
            border-left: 4px solid var(--danger);
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            align-items: center;
            gap: 1.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .not-found-text {
            color: #d92a20;
            font-weight: 600;
            display: flex;
            align-items: center;
            font-size: 1.05rem;
        }

        /* Data Grid */
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        .data-card {
            background: var(--bg-card);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            animation: slideUpFade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
            box-shadow: var(--shadow-md);
        }

        .data-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-glow);
            border-radius: 4px 0 0 4px;
        }

        .data-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(0,0,0,0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .card-date {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #f0f0f5;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
        }

        /* 欄位色彩區分 (Color-coded Field Themes) */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.85rem;
        }

        .field-box {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            border: 1px solid transparent;
            min-height: 62px;
            justify-content: center;
        }

        .field-box.full-width {
            grid-column: 1 / -1;
        }

        .field-label {
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .field-val {
            font-size: 0.98rem;
            font-weight: 500;
            word-break: break-all;
            line-height: 1.4;
        }

        /* 1. 現狀/新位置 (綠色系 - 現行狀態) */
        .field-theme-current {
            background: rgba(52, 199, 89, 0.08);
            border-color: rgba(52, 199, 89, 0.22);
        }
        .field-theme-current .field-label {
            color: #1b873f;
        }
        .field-theme-current .field-val {
            color: #0d5c24;
            font-weight: 600;
        }

        /* 2. 原保管人/原位置 (紫藍系 - 歷史源頭) */
        .field-theme-origin {
            background: rgba(88, 86, 214, 0.06);
            border-color: rgba(88, 86, 214, 0.2);
        }
        .field-theme-origin .field-label {
            color: #5856d6;
        }
        .field-theme-origin .field-val {
            color: #3634a3;
        }

        /* 3. 機型/規格/年分 (天藍系 - 硬體屬性) */
        .field-theme-spec {
            background: rgba(0, 113, 227, 0.06);
            border-color: rgba(0, 113, 227, 0.18);
        }
        .field-theme-spec .field-label {
            color: #0071e3;
        }
        .field-theme-spec .field-val {
            color: #1d1d1f;
            font-weight: 600;
        }

        /* 4. 狀況/處理狀況 (狀態膠囊) */
        .field-theme-status {
            background: #fbfbfd;
            border-color: rgba(0, 0, 0, 0.08);
        }
        .field-theme-status .field-label {
            color: #6e6e73;
        }

        /* 5. 備註/說明 (琥珀橙系 - 備忘訊息) */
        .field-theme-note {
            background: rgba(255, 149, 0, 0.08);
            border: 1px solid rgba(255, 149, 0, 0.25);
            border-left: 4px solid #ff9500;
            border-radius: 4px var(--radius-sm) var(--radius-sm) 4px;
        }
        .field-theme-note .field-label {
            color: #b25000;
        }
        .field-theme-note .field-val {
            color: #5c3000;
        }

        /* 6. 其他自訂欄位 */
        .field-theme-default {
            background: #f8f8fa;
            border-color: rgba(0, 0, 0, 0.06);
        }
        .field-theme-default .field-label {
            color: #86868b;
        }
        .field-theme-default .field-val {
            color: #1d1d1f;
        }

        /* 狀態膠囊 Badge */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0.22rem 0.7rem;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            width: fit-content;
        }
        .status-pill.status-active {
            background: rgba(52, 199, 89, 0.15);
            color: #1b873f;
            border: 1px solid rgba(52, 199, 89, 0.3);
        }
        .status-pill.status-scrap {
            background: rgba(255, 59, 48, 0.12);
            color: #d70015;
            border: 1px solid rgba(255, 59, 48, 0.25);
        }
        .status-pill.status-spare {
            background: rgba(255, 149, 0, 0.15);
            color: #b25000;
            border: 1px solid rgba(255, 149, 0, 0.3);
        }
        .status-pill.status-other {
            background: rgba(142, 142, 147, 0.15);
            color: #48484a;
            border: 1px solid rgba(142, 142, 147, 0.25);
        }

        /* 卡片標題與編號 Badge */
        .prop-id-badge {
            background: rgba(0, 113, 227, 0.1);
            color: var(--accent-glow);
            padding: 0.25rem 0.65rem;
            border-radius: 8px;
            font-family: 'Orbitron', monospace, sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 113, 227, 0.2);
        }

        /* Modal Form */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(30px) scale(0.95);
            transition: var(--transition);
            box-shadow: var(--shadow-lg);
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            letter-spacing: -0.5px;
        }
        
        .modal-title::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--accent-glow);
            border-radius: 50%;
        }

        .btn-close {
            background: #f0f0f5;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-close:hover {
            background: #e5e5ea;
            color: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-control {
            background: #f8f8f9;
            border: 1.5px solid var(--border);
            color: var(--text-main);
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 4px var(--accent-dim);
            background: #ffffff;
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            background: #fafafa;
        }

        /* Loading */
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 113, 227, 0.2);
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            margin: 3rem auto;
            display: none;
        }
        .loader::after {
            content: '';  
            box-sizing: border-box;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid;
            border-color: var(--accent-glow) transparent;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Design (RWD) Adjustments */
        @media (max-width: 768px) {
            header {
                padding: 1rem;
                flex-wrap: wrap;
                gap: 1rem;
            }
            header .btn {
                width: auto;
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            .logo {
                font-size: 1.1rem;
            }
            main {
                padding: 1.5rem 1rem;
            }
            .controls-area {
                flex-direction: column;
                align-items: stretch;
            }
            .search-container {
                max-width: 100%;
            }
            .search-input {
                font-size: 1rem;
                padding: 1rem 1.2rem 1rem 3rem;
            }
            .not-found-area {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .results-container {
                grid-template-columns: 1fr;
            }
            .data-card {
                padding: 1.2rem;
            }
            .card-header {
                flex-direction: column;
                gap: 0.5rem;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .modal-header {
                padding: 1.2rem 1.5rem;
            }
            .modal-body {
                padding: 1.2rem 1.5rem;
            }
            .modal-footer {
                padding: 1.2rem 1.5rem;
                flex-direction: column-reverse; /* Buttons stack nicely */
            }
            .modal-footer .btn {
                width: 100%;
                justify-content: center;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar track */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M10 4v16"></path>
                <path d="M14 4v16"></path>
                <circle cx="6" cy="12" r="1" fill="currentColor"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor"></circle>
            </svg>
            HOST:PROPERTY_MGMT
        </div>
        <a href="../index.html" class="btn">返回首頁</a>
        <button class="btn" id="btnDebug" style="font-size:0.8rem; opacity:0.6;">🔍 Debug</button>
    </header>

    <main>
        <div class="controls-area">
            <div style="flex:1;">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="掃描或輸入財產編號..." autocomplete="off" value="314010103-000">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                
                <!-- 新增篩選功能 -->
                <div class="filters-container" style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; align-items: center;">
                    <input type="text" id="filterYear" list="flist_year" class="form-control" placeholder="-- 電腦年分 --" style="flex: 1; min-width: 120px; padding: 0.6rem 1rem;">
                    <datalist id="flist_year"></datalist>

                    <input type="text" id="filterStatus" list="flist_status" class="form-control" placeholder="-- 狀況 --" style="flex: 1; min-width: 120px; padding: 0.6rem 1rem;">
                    <datalist id="flist_status"></datalist>

                    <input type="text" id="filterModel" list="flist_model" class="form-control" placeholder="-- 型號 --" style="flex: 1; min-width: 120px; padding: 0.6rem 1rem;">
                    <datalist id="flist_model"></datalist>

                    <input type="text" id="filterLocation" list="flist_loc" class="form-control" placeholder="-- 新位置 --" style="flex: 1; min-width: 120px; padding: 0.6rem 1rem;">
                    <datalist id="flist_loc"></datalist>
                    
                    <div id="filterCount" style="color: var(--accent-glow); font-weight: 600; min-width: 80px; display: none;">符合: 0 筆</div>
                </div>

                <div class="status-message" id="statusMessage">系統初始化中，請稍候...</div>
                
                <div class="not-found-area" id="notFoundArea">
                    <div class="not-found-text">
                        <svg viewBox="0 0 24 24" width="20" height="20" style="display:inline; vertical-align:text-bottom; margin-right:4px;">
                            <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        </svg>
                        查無此財產編號資料
                    </div>
                    <button id="btnOpenAddForm" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v16m8-8H4"/></svg>
                        新增財產
                    </button>
                </div>
            </div>
        </div>

        <span class="loader" id="loader"></span>
        <div class="results-container" id="resultsContainer">
            <!-- Data Cards will be injected here -->
        </div>
    </main>

    <!-- Modal Form -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">新增主機財產登記</div>
                <button class="btn-close" id="btnCloseModal">×</button>
            </div>
            <div class="modal-body">
                <form id="addForm" class="form-grid">
                    <!-- 動態欄位由 JavaScript 依據 Google 試算表實際欄位產生 -->
                </form>
            </div>
            <div class="modal-footer" style="flex-wrap: wrap; gap: 0.8rem;">
                <div style="display:flex; align-items:center; gap:0.6rem; flex:1; min-width:200px;">
                    <label style="font-size:0.9rem; font-weight:600; white-space:nowrap; color:var(--text-muted);">🔑 操作密碼</label>
                    <input type="password" id="f_token" class="form-control" placeholder="請輸入密碼" style="flex:1;">
                </div>
                <div style="display:flex; gap:0.8rem;">
                    <button type="button" class="btn" id="btnCancelModal">取消</button>
                    <button type="button" class="btn btn-primary" id="btnSubmitForm">儲存資料</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID   = '1qg3nYreVGnIejBpkoZPVb-7PvEjpqAZuVowjnvBHvy8';
        const SHEET_NAME = 'data';
        const CSV_URL    = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
        // ★ 部署 GAS 後貼上你的 Web App URL
        const GAS_URL    = 'https://script.google.com/macros/s/AKfycby7TzQUXBFi6FH5gB2XjCYgAEr3ZeE2f8awLjrDb6BzXVPC-2_vmfKM7I8YjCz1vW6d/exec';

        const CACHE_KEY = 'asset_data_v4';
        const CACHE_TTL = 3 * 60 * 1000; // 3 分鐘快取

        let globalData       = [];
        let currentHeaders   = [];     // 試算表實際存在的欄位清單
        let labelKey         = '財產編號'; // 財產編號的主鍵欄位名稱
        let dateKey          = '';     // 異動日期欄位名稱
        let uniqueValues     = {};     // 各欄位的不重複值（供 datalist 自動補全）
        let currentEditMode  = 'add';  // 'add' | 'update'
        let currentEditLabel = null;   // 編輯模式時的原財產編號
        let currentPrefill   = '314010103-000';

        const searchInput      = document.getElementById('searchInput');
        const loader           = document.getElementById('loader');
        const resultsContainer = document.getElementById('resultsContainer');
        const statusMessage    = document.getElementById('statusMessage');
        const notFoundArea     = document.getElementById('notFoundArea');
        
        // Modal elements
        const addModal       = document.getElementById('addModal');
        const addForm        = document.getElementById('addForm');
        const btnOpenAddForm = document.getElementById('btnOpenAddForm');
        const btnCloseModal  = document.getElementById('btnCloseModal');
        const btnCancelModal = document.getElementById('btnCancelModal');
        const btnSubmitForm  = document.getElementById('btnSubmitForm');

        // ── 工具函式 ──────────────────────────────────────────
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // 去除連字號、空白與特殊符號，轉小寫（正規化比對專用）
        function normalizeCode(str) {
            return (str || '').toString().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');
        }

        function sanitizeDomId(str) {
            return encodeURIComponent(str).replace(/%/g, '_');
        }

        function _todayStr() {
            const off = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(Date.now() - off)).toISOString().slice(0, 10);
        }

        // ── 自動偵測試算表結構 ────────────────────────────────
        function identifySchema(headers) {
            currentHeaders = headers;

            // 尋找財產編號/主鍵欄位
            labelKey = headers.find(h => /財產.*(編號|標籤)|(主機|設備).*(編號|標籤)|^財產$/.test(h))
                    || headers.find(h => /財產|編號|標籤/.test(h))
                    || headers[0] || '財產編號';

            // 尋找日期欄位
            dateKey = headers.find(h => /異動日期|登記.*日期|追蹤日期|^日期$/.test(h))
                   || headers.find(h => /日期/.test(h))
                   || '';
        }

        // ── 資料初始化 ────────────────────────────────────────
        async function init(forceRefresh = false) {
            loader.style.display = 'block';
            statusMessage.textContent = '讀取 Google 試算表資料中...';

            if (!forceRefresh) {
                try {
                    const cached = sessionStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const { data, headers, ts } = JSON.parse(cached);
                        if (Date.now() - ts < CACHE_TTL && Array.isArray(data) && data.length > 0) {
                            globalData = data;
                            identifySchema(headers || Object.keys(data[0]));
                            loader.style.display = 'none';
                            statusMessage.textContent = `已載入資料（共 ${globalData.length} 筆，快取）。輸入財產編號進行查詢。`;
                            extractUniqueValues();
                            setupFilters();
                            handleSearch();
                            searchInput.focus();
                            return;
                        }
                    }
                } catch(_) {}
            }

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();

                // 改用 header: false 避免 Google Sheets 尾端空白欄位引起 PapaParse 引號解析錯亂
                Papa.parse(csvText, {
                    header: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        if (!results.data || results.data.length === 0) {
                            statusMessage.textContent = '試算表中無任何資料';
                            loader.style.display = 'none';
                            return;
                        }

                        // 第 1 列為表頭：過濾有效欄位（排除尾端空白欄與「第 1 欄」）
                        const rawHeaderRow = results.data[0];
                        const cleanHeaderMap = [];

                        rawHeaderRow.forEach((h, idx) => {
                            const name = String(h || '').replace(/^\uFEFF/, '').trim();
                            if (name && name !== '第 1 欄' && !name.startsWith('Unnamed')) {
                                cleanHeaderMap.push({ name: name, colIdx: idx });
                            }
                        });

                        const cleanHeaders = cleanHeaderMap.map(item => item.name);
                        identifySchema(cleanHeaders);

                        // 從第 2 列開始解析每筆資料
                        globalData = [];
                        for (let i = 1; i < results.data.length; i++) {
                            const row = results.data[i];
                            const cleaned = {};
                            cleanHeaderMap.forEach(item => {
                                const val = row[item.colIdx];
                                cleaned[item.name] = (val !== undefined && val !== null) ? String(val).trim() : '';
                            });
                            if (Object.values(cleaned).some(v => v !== '')) {
                                globalData.push(cleaned);
                            }
                        }

                        try {
                            sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                                data: globalData,
                                headers: cleanHeaders,
                                ts: Date.now()
                            }));
                        } catch(_) {}

                        loader.style.display = 'none';
                        statusMessage.textContent = `已成功載入資料（共 ${globalData.length} 筆，${cleanHeaders.length} 個欄位）。輸入財產編號進行查詢。`;
                        extractUniqueValues();
                        setupFilters();
                        handleSearch();
                        searchInput.focus();
                    },
                    error: function(err) {
                        statusMessage.textContent = '資料載入失敗: ' + err.message;
                        loader.style.display = 'none';
                    }
                });
            } catch (error) {
                statusMessage.textContent = '無法連線至資料庫或試算表尚未公開。請確認試算表分享權限。';
                loader.style.display = 'none';
                console.error(error);
            }
        }

        // 提取所有欄位的不重複值（支援任何新增/修改欄位）
        function extractUniqueValues() {
            uniqueValues = {};
            currentHeaders.forEach(field => {
                uniqueValues[field] = new Set();
            });

            globalData.forEach(row => {
                currentHeaders.forEach(field => {
                    const val = row[field];
                    if (val && String(val).trim() !== '') {
                        uniqueValues[field].add(String(val).trim());
                    }
                });
            });
        }

        // 動態綁定頂部快捷篩選器
        function setupFilters() {
            const filterMap = [
                { id: 'filterYear',     dlId: 'flist_year',   regex: /年分|年份/ },
                { id: 'filterStatus',   dlId: 'flist_status', regex: /狀況|狀態/ },
                { id: 'filterModel',    dlId: 'flist_model',  regex: /型號|規格/ },
                { id: 'filterLocation', dlId: 'flist_loc',    regex: /新位置|位置|處室/ }
            ];

            filterMap.forEach(cfg => {
                const matchedCol = currentHeaders.find(h => cfg.regex.test(h));
                const inputEl = document.getElementById(cfg.id);
                const dlEl = document.getElementById(cfg.dlId);

                if (matchedCol && inputEl && dlEl) {
                    inputEl.dataset.field = matchedCol;
                    inputEl.placeholder = `-- ${matchedCol} --`;
                    dlEl.innerHTML = '';
                    const vals = Array.from(uniqueValues[matchedCol] || []).sort();
                    vals.forEach(v => {
                        const opt = document.createElement('option');
                        opt.value = v;
                        dlEl.appendChild(opt);
                    });
                }
            });
        }

        // ── 欄位色彩主題分類與狀態標籤 ───────────────────────
        function getFieldTheme(fieldName) {
            if (/新保管人|新位置|現有位置|現保管人|目前保管人|目前位置/.test(fieldName)) {
                return { themeClass: 'field-theme-current', icon: '📍' };
            }
            if (/原保管人|原使用|舊位置|原位置|舊保管人/.test(fieldName)) {
                return { themeClass: 'field-theme-origin', icon: '📦' };
            }
            if (/型號|電腦年分|年份|規格|品牌|CPU|RAM|硬碟|其他/.test(fieldName)) {
                return { themeClass: 'field-theme-spec', icon: '💻' };
            }
            if (/狀況|狀態/.test(fieldName)) {
                return { themeClass: 'field-theme-status', icon: '⚡' };
            }
            if (/備註|說明|原因|附註/.test(fieldName)) {
                return { themeClass: 'field-theme-note', icon: '📝' };
            }
            return { themeClass: 'field-theme-default', icon: '🏷️' };
        }

        function formatStatusVal(val) {
            if (!val || val === '-') return '-';
            let pillClass = 'status-other';
            let dot = '⚪';
            if (/使用中|良好|正常/.test(val)) {
                pillClass = 'status-active';
                dot = '🟢';
            } else if (/報廢|壞|損壞|待報廢/.test(val)) {
                pillClass = 'status-scrap';
                dot = '🔴';
            } else if (/備用|存置|待修|借出|閒置/.test(val)) {
                pillClass = 'status-spare';
                dot = '🟡';
            }
            return `<span class="status-pill ${pillClass}">${dot} ${escapeHtml(val)}</span>`;
        }

        // ── 卡片渲染（完全動態自適應色彩區分） ────────────────
        function renderCards(records) {
            resultsContainer.innerHTML = '';

            // 排除主標題、日期、時間戳記後的其餘所有欄位
            const displayHeaders = currentHeaders.filter(h =>
                h !== labelKey && h !== dateKey && h !== '時間戳記'
            );

            records.forEach((record, index) => {
                const card = document.createElement('div');
                card.className = 'data-card';
                card.style.animationDelay = `${Math.min(index * 0.05, 0.4)}s`;

                const propLabel = record[labelKey] || '-';
                const dateVal = dateKey ? (record[dateKey] || '-') : '';

                let gridHtml = '';
                displayHeaders.forEach(field => {
                    const rawVal = record[field];
                    const val = (rawVal !== undefined && rawVal !== null && String(rawVal).trim() !== '') ? String(rawVal).trim() : '-';
                    const theme = getFieldTheme(field);
                    const isFullWidth = /備註|說明|原因|附註/.test(field) || String(val).length > 28;

                    let renderedVal = escapeHtml(val);
                    if (/狀況|狀態/.test(field)) {
                        renderedVal = formatStatusVal(val);
                    }

                    gridHtml += `
                        <div class="field-box ${theme.themeClass} ${isFullWidth ? 'full-width' : ''}">
                            <span class="field-label">${theme.icon} ${escapeHtml(field)}</span>
                            <span class="field-val">${renderedVal}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title" style="display: flex; align-items: center; gap: 0.8rem;">
                            <input type="checkbox" class="record-checkbox" value="${escapeHtml(propLabel)}" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-glow);">
                            <span class="prop-id-badge">${escapeHtml(propLabel)}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:0.8rem;">
                            <button class="btn edit-card-btn" data-label="${escapeHtml(propLabel)}"
                                style="padding:0.35rem 0.9rem; font-size:0.82rem; border-radius:8px;">
                                ✏️ 編輯
                            </button>
                            ${dateVal ? `<div class="card-date">📅 ${escapeHtml(dateVal)}</div>` : ''}
                        </div>
                    </div>
                    <div class="info-grid">
                        ${gridHtml}
                    </div>
                `;

                resultsContainer.appendChild(card);

                // 勾選變色
                const cb = card.querySelector('.record-checkbox');
                cb.addEventListener('change', function() {
                    if (this.checked) {
                        card.style.borderColor = 'var(--danger)';
                        card.style.backgroundColor = 'rgba(255, 59, 48, 0.08)';
                        card.style.boxShadow = '0 0 0 2px rgba(255, 59, 48, 0.15), var(--shadow-md)';
                    } else {
                        card.style.borderColor = 'rgba(0,0,0,0.05)';
                        card.style.backgroundColor = 'var(--bg-card)';
                        card.style.boxShadow = 'var(--shadow-md)';
                    }
                });

                // 編輯按鈕
                card.querySelector('.edit-card-btn').addEventListener('click', function() {
                    const lbl = this.dataset.label;
                    const rec = globalData.find(r => r[labelKey] === lbl);
                    if (rec) openModal('update', rec);
                });
            });
        }

        // ── 智慧正規化搜尋 ───────────────────────────────────
        function handleSearch() {
            const rawQuery = searchInput.value.trim();
            const queryLower = rawQuery.toLowerCase();
            const cleanQuery = normalizeCode(rawQuery);

            // 預設前綴未打完時視為空查詢
            const isQueryEmpty = (rawQuery === '' || rawQuery === '314010103-000' || rawQuery === '314010103-');

            // 篩選器值
            const fYearEl = document.getElementById('filterYear');
            const fStatusEl = document.getElementById('filterStatus');
            const fModelEl = document.getElementById('filterModel');
            const fLocEl = document.getElementById('filterLocation');

            const filterYearVal = fYearEl.value.trim();
            const filterStatusVal = fStatusEl.value.trim();
            const filterModelVal = fModelEl.value.trim();
            const filterLocationVal = fLocEl.value.trim();

            const yearCol = fYearEl.dataset.field;
            const statusCol = fStatusEl.dataset.field;
            const modelCol = fModelEl.dataset.field;
            const locCol = fLocEl.dataset.field;

            const hasFilters = filterYearVal || filterStatusVal || filterModelVal || filterLocationVal;

            if (isQueryEmpty && !hasFilters) {
                resultsContainer.innerHTML = '';
                notFoundArea.style.display = 'none';
                document.getElementById('filterCount').style.display = 'none';
                return;
            }

            const matches = globalData.filter(row => {
                let matchQuery = isQueryEmpty;
                if (!matchQuery) {
                    const rawLabel = (row[labelKey] || '').toString();
                    const labelLower = rawLabel.toLowerCase();
                    const cleanLabel = normalizeCode(rawLabel);

                    // 1. 原字串包含 或 2. 去除減號/符號後的正規化包含
                    // （例如 314010103-0001645 自動匹配 3140101-03-0001645，輸入 1645 也直接匹配）
                    if (labelLower.includes(queryLower) || cleanLabel.includes(cleanQuery)) {
                        matchQuery = true;
                    } else {
                        // 3. 全文各欄位模糊比對（如輸入保管人人名、位置等）
                        matchQuery = Object.values(row).some(val =>
                            (val || '').toString().toLowerCase().includes(queryLower)
                        );
                    }
                }

                const matchYear   = !filterYearVal || (yearCol && row[yearCol] === filterYearVal);
                const matchStatus = !filterStatusVal || (statusCol && row[statusCol] === filterStatusVal);
                const matchModel  = !filterModelVal || (modelCol && row[modelCol] === filterModelVal);
                const matchLoc    = !filterLocationVal || (locCol && row[locCol] === filterLocationVal);

                return matchQuery && matchYear && matchStatus && matchModel && matchLoc;
            });

            if (matches.length > 0) {
                notFoundArea.style.display = 'none';
                document.getElementById('filterCount').style.display = 'block';
                document.getElementById('filterCount').textContent = `符合: ${matches.length} 筆`;
                renderCards(matches);
            } else {
                resultsContainer.innerHTML = '';
                notFoundArea.style.display = 'flex';
                document.getElementById('filterCount').style.display = 'none';

                // 自動產生建議的財產編號
                let defLabel = '314010103-000';
                if (rawQuery.startsWith('314010103-000') || rawQuery.startsWith('3140101-03-') || rawQuery.startsWith('314010103-')) {
                    defLabel = rawQuery;
                } else if (/^\d+$/.test(rawQuery)) {
                    // 若使用者只輸入數字末碼（如 1645），自動補齊成完整號碼
                    defLabel = '314010103-000' + rawQuery.padStart(4, '0');
                } else if (rawQuery.length > 0) {
                    defLabel = '314010103-000' + rawQuery;
                }
                currentPrefill = defLabel;
            }
        }

        searchInput.addEventListener('input', handleSearch);
        document.getElementById('filterYear').addEventListener('input', handleSearch);
        document.getElementById('filterStatus').addEventListener('input', handleSearch);
        document.getElementById('filterModel').addEventListener('input', handleSearch);
        document.getElementById('filterLocation').addEventListener('input', handleSearch);

        // ── 動態 Modal 表單 ──────────────────────────────────
        function openModal(mode = 'add', record = null) {
            currentEditMode  = mode;
            currentEditLabel = record ? record[labelKey] : null;

            document.getElementById('modalTitle').textContent =
                mode === 'update' ? '編輯主機財產登記' : '新增主機財產登記';

            addForm.innerHTML = '';

            // 表單欄位清單（略過時間戳記）
            const formHeaders = currentHeaders.filter(h => h !== '時間戳記');

            formHeaders.forEach(col => {
                const formGroup = document.createElement('div');
                const isFull = /備註|說明|原因|附註/.test(col);
                formGroup.className = `form-group ${isFull ? 'full' : ''}`;

                const theme = getFieldTheme(col);
                const label = document.createElement('label');
                label.className = 'form-label';
                label.innerHTML = `${theme.icon} ${escapeHtml(col)}`;
                formGroup.appendChild(label);

                const inputId = 'field_' + sanitizeDomId(col);
                const dlId    = 'dl_modal_' + sanitizeDomId(col);

                const isLabelCol = (col === labelKey);
                const isDateCol  = (col === dateKey || /日期/.test(col));

                if (isDateCol) {
                    const input = document.createElement('input');
                    input.type = 'date';
                    input.className = 'form-control';
                    input.id = inputId;
                    input.required = isDateCol;
                    if (mode === 'update' && record) {
                        input.value = record[col] || _todayStr();
                    } else {
                        input.value = _todayStr();
                    }
                    formGroup.appendChild(input);
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'form-control';
                    input.id = inputId;
                    input.setAttribute('list', dlId);

                    if (isLabelCol) {
                        input.required = true;
                        if (mode === 'update') {
                            input.value = record[col] || '';
                            input.readOnly = true;
                            input.style.opacity = '0.7';
                        } else {
                            input.value = currentPrefill || '314010103-000';
                        }
                    } else {
                        input.value = (mode === 'update' && record) ? (record[col] || '') : '';
                    }

                    // 綁定動態 datalist
                    const datalist = document.createElement('datalist');
                    datalist.id = dlId;
                    if (uniqueValues[col]) {
                        Array.from(uniqueValues[col]).sort().forEach(val => {
                            const opt = document.createElement('option');
                            opt.value = val;
                            datalist.appendChild(opt);
                        });
                    }
                    formGroup.appendChild(input);
                    formGroup.appendChild(datalist);
                }

                addForm.appendChild(formGroup);
            });

            addModal.classList.add('active');
        }

        function closeModal() {
            addModal.classList.remove('active');
        }

        btnOpenAddForm.addEventListener('click', () => openModal('add'));
        btnCloseModal.addEventListener('click', closeModal);
        btnCancelModal.addEventListener('click', closeModal);
        addModal.addEventListener('click', (e) => { if (e.target === addModal) closeModal(); });

        // ── 儲存資料（動態組裝 + 完整錯誤捕捉） ───────────────
        btnSubmitForm.addEventListener('click', async () => {
            const labelInput = document.getElementById('field_' + sanitizeDomId(labelKey));
            const labelVal = labelInput ? labelInput.value.trim() : '';
            if (!labelVal) { alert(`請輸入「${labelKey}」`); return; }

            if (GAS_URL === 'YOUR_GAS_WEB_APP_URL') {
                alert('⚠️ 尚未設定 GAS_URL！\n請先部署 Google Apps Script 並貼上 Web App URL。');
                return;
            }

            const tokenVal = document.getElementById('f_token').value;
            if (!tokenVal) { alert('請輸入操作密碼'); return; }

            // 動態組裝 payload
            const payload = {
                action: currentEditMode,
                _token: tokenVal,
                targetLabel: currentEditLabel || labelVal // 編輯時定位原始編號
            };

            currentHeaders.forEach(col => {
                if (col === '時間戳記') return;
                const el = document.getElementById('field_' + sanitizeDomId(col));
                if (el) payload[col] = el.value.trim();
            });

            // 確保主鍵在 payload 內
            if (!payload[labelKey]) payload[labelKey] = labelVal;

            // 雙向相容：同時提供「備註」與「備註1」以防試算表或 GAS 欄位名稱差異
            if (payload['備註'] && !payload['備註1']) payload['備註1'] = payload['備註'];
            if (payload['備註1'] && !payload['備註']) payload['備註'] = payload['備註1'];

            btnSubmitForm.disabled    = true;
            btnSubmitForm.textContent = '送出中...';

            try {
                // 送出 Simple POST 請求
                const resp = await fetch(GAS_URL, {
                    method:  'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body:    JSON.stringify(payload)
                });

                let resData = null;
                try {
                    resData = await resp.json();
                } catch(_) {}

                // 檢查後端錯誤
                if (resData && resData.result === 'error') {
                    if (resData.message === 'Unauthorized') {
                        alert('❌ 操作密碼錯誤！請確認密碼是否與 Google Apps Script 中設定一致。');
                    } else {
                        alert('❌ 儲存失敗：' + resData.message);
                    }
                    return;
                }

                // ── 更新本機記憶體 ──
                if (currentEditMode === 'update') {
                    const targetToFind = normalizeCode(currentEditLabel || labelVal);
                    const idx = globalData.findIndex(r => normalizeCode(r[labelKey]) === targetToFind);
                    if (idx !== -1) {
                        Object.assign(globalData[idx], payload);
                    }
                } else {
                    const newRec = { ...payload };
                    globalData.unshift(newRec);
                }

                // 更新快取
                try {
                    sessionStorage.setItem(CACHE_KEY, JSON.stringify({
                        data: globalData,
                        headers: currentHeaders,
                        ts: Date.now()
                    }));
                } catch(_) {}

                extractUniqueValues();
                setupFilters();
                closeModal();
                handleSearch();
                showToast(currentEditMode === 'update' ? '✅ 資料已成功更新！' : '✅ 資料已成功新增！');

            } catch (err) {
                alert('❌ 送出失敗：' + err.message);
            } finally {
                btnSubmitForm.disabled    = false;
                btnSubmitForm.textContent = '儲存資料';
            }
        });

        // ── Toast 通知 ──────────────────────────────────────────
        function showToast(msg) {
            let toast = document.getElementById('_toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = '_toast';
                toast.style.cssText = [
                    'position:fixed', 'bottom:2rem', 'left:50%', 'transform:translateX(-50%) translateY(20px)',
                    'background:#1d1d1f', 'color:#fff', 'padding:0.8rem 1.8rem',
                    'border-radius:999px', 'font-size:0.95rem', 'font-weight:500',
                    'box-shadow:0 8px 24px rgba(0,0,0,0.25)', 'z-index:9999',
                    'opacity:0', 'transition:all 0.3s cubic-bezier(0.25,0.8,0.25,1)',
                    'pointer-events:none'
                ].join(';');
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            });
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
            }, 3000);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => init(false));

        document.getElementById('btnDebug').addEventListener('click', () => {
            if (!globalData.length) { alert('資料尚未載入'); return; }
            const sample = globalData.slice(0, 3).map(r => r[labelKey]);
            alert(
                `共 ${globalData.length} 筆資料\n` +
                `目前主鍵欄位: 「${labelKey}」\n` +
                `欄位清單 (${currentHeaders.length}):\n${JSON.stringify(currentHeaders, null, 2)}\n\n` +
                `前 3 筆資料主鍵: ${JSON.stringify(sample)}`
            );
        });
    </script>
</body>
</html>
